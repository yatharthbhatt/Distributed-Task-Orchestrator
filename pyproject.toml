[project]
name = "distributed-task-orchestrator"
version = "1.0.0"
description = "Fault-tolerant, horizontally scalable distributed task orchestrator (Celery + Redis + FastAPI + Postgres)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # str+Enum mix is intentional (JSON-friendly values via .value)
]
